# Test-only additions for the Dovecot image in docker-compose.yml: password login over plain IMAP (the port
# is bound to 127.0.0.1 only) and the special folders created for every new test user.
auth_allow_cleartext = yes

namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Archive {
    auto = create
  }
}
